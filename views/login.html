<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Admin Yayasan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded-xl shadow-md w-96 border border-slate-200">
    <div class="text-center mb-6">
      <img src="/logo.png" class="h-10 mx-auto mb-2 object-contain" onerror="this.src='https://via.placeholder.com/100x40?text=Logo'">
      <h2 class="text-lg font-bold text-slate-800">Login Admin Yayasan</h2>
    </div>
    
    <form id="form-login" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-slate-600">Username Admin</label>
        <input type="text" id="username" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm mt-1 focus:ring-2 focus:ring-teal-500 outline-none" required>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-600">Password</label>
        <input type="password" id="password" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm mt-1 focus:ring-2 focus:ring-teal-500 outline-none" required>
      </div>
      <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white py-2.5 rounded-lg font-semibold text-sm transition-colors">Masuk Dashboard</button>
    </form>
  </div>

  <script>
    document.getElementById('form-login').onsubmit = async (e) => {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: e.target.username.value,
          password: e.target.password.value
        })
      });
      const result = await res.json();
      if(result.success) window.location.href = '/admin';
      else alert(result.message);
    };
  </script>
</body>
</html>
