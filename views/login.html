<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Yayasan Sentuhan Kasih</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Inter', sans-serif; 
    }
    .bg-login-theme {
      background: linear-gradient(135deg, #e8f6f6 0%, #dcf0f2 50%, #eaf8f8 100%);
      background-attachment: fixed;
    }
    .bg-pattern {
      background-image: radial-gradient(#00a896 0.6px, transparent 0.6px);
      background-size: 20px 20px;
      opacity: 0.12;
    }
  </style>
</head>
<body class="bg-login-theme text-slate-800 antialiased min-h-screen flex items-center justify-center p-4 relative">

  <!-- Pattern Overlay -->
  <div class="fixed inset-0 bg-pattern pointer-events-none z-0"></div>

  <!-- CONTAINER LOGIN -->
  <div class="relative z-10 w-full max-w-md">
    
    <!-- Tombol Navigasi Kembali -->
    <div class="mb-4 text-left">
      <a href="/" class="inline-flex items-center gap-2 text-xs font-bold text-slate-600 hover:text-teal-800 bg-white/80 hover:bg-white px-3.5 py-2 rounded-xl border border-slate-200/80 shadow-sm transition-all">
        ← Kembali ke Katalog Utama
      </a>
    </div>

    <!-- KARTU FORM LOGIN -->
    <div class="bg-white/95 backdrop-blur-md p-6 sm:p-8 rounded-2xl shadow-xl border border-teal-100/80">
      
      <!-- Header Form & Logo -->
      <div class="text-center mb-6">
        <img src="/logo.png" 
             alt="Logo Yayasan" 
             class="w-14 h-14 mx-auto mb-3 object-contain rounded-2xl bg-white p-1.5 border border-teal-100 shadow-sm"
             onerror="this.style.display='none'">
        
        <h1 class="text-xl font-extrabold text-teal-950 tracking-tight">Login Panel Admin</h1>
        <p class="text-xs text-slate-500 mt-1 font-medium">Yayasan Sentuhan Kasih</p>
      </div>

      <!-- Kotak Pesan Error (Muncul jika Login Gagal) -->
      <div id="error-box" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs font-semibold text-rose-700 text-center">
      </div>

      <!-- FORM LOGIN -->
      <form id="form-login" class="space-y-4 text-xs">
        <div>
          <label for="username" class="font-bold text-slate-700 block mb-1">Username Admin</label>
          <input type="text" 
                 id="username" 
                 name="username" 
                 required 
                 placeholder="Masukkan username..." 
                 class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all text-slate-800 text-xs">
        </div>

        <div>
          <label for="password" class="font-bold text-slate-700 block mb-1">Password</label>
          <input type="password" 
                 id="password" 
                 name="password" 
                 required 
                 placeholder="••••••••" 
                 class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all text-slate-800 text-xs">
        </div>

        <button type="submit" 
                id="btn-login" 
                class="w-full py-3 bg-teal-800 hover:bg-teal-900 active:scale-[0.99] text-white font-extrabold rounded-xl transition-all shadow-md shadow-teal-900/10 text-xs mt-2 flex items-center justify-center gap-2 cursor-pointer">
          🔒 Masuk Dashboard
        </button>
      </form>

      <!-- Footer Kartu -->
      <div class="mt-6 pt-4 border-t border-slate-100 text-center text-[11px] text-slate-400">
        Akses terbatas hanya untuk pengelola sistem.
      </div>

    </div>

    <!-- Footnote Sederhana -->
    <p class="text-center text-[11px] text-slate-400 mt-4 font-medium">
      © 2026 Yayasan Sentuhan Kasih
    </p>

  </div>

  <script>
    document.getElementById('form-login').onsubmit = async (e) => {
      e.preventDefault();

      const btnLogin = document.getElementById('btn-login');
      const errorBox = document.getElementById('error-box');

      // Sembunyikan pesan error sebelumnya
      errorBox.classList.add('hidden');
      errorBox.innerText = '';

      // Set State Loading
      btnLogin.disabled = true;
      btnLogin.innerHTML = '⌛ Memeriksa Sesi...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: e.target.username.value,
            password: e.target.password.value
          })
        });

        const result = await res.json();

        if (result.success) {
          window.location.href = '/admin';
        } else {
          // Tampilkan Error di UI
          errorBox.innerText = result.message || 'Username atau password salah!';
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        errorBox.innerText = 'Terjadi kesalahan koneksi ke server.';
        errorBox.classList.remove('hidden');
      } finally {
        btnLogin.disabled = false;
        btnLogin.innerHTML = '🔒 Masuk Dashboard';
      }
    };
  </script>
</body>
</html>
