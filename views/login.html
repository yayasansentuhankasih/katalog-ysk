<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Yayasan Sentuhan Kasih</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Fonts: Plus Jakarta Sans & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
    }
    .font-serif-title {
      font-family: 'Playfair Display', serif;
    }

    /* BACKGROUND ELEGAN & MEWAH */
    .bg-login-theme {
      background-color: #FAF8F5;
      background-image: 
        radial-gradient(at 0% 0%, rgba(212, 175, 55, 0.1) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(6, 78, 59, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(245, 230, 211, 0.6) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(255, 255, 255, 0.95) 0px, transparent 50%);
      background-attachment: fixed;
    }

    /* POLA DEKORATIF ORNAMEN MEWAH */
    .bg-pattern {
      background-image: radial-gradient(#d4af37 0.6px, transparent 0.6px);
      background-size: 28px 28px;
      opacity: 0.15;
    }

    /* GRADIENT TEKS GOLD ELEGAN */
    .text-gold-gradient {
      background: linear-gradient(90deg, #d8b049 0%, #faeecf 50%, #b3821a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="bg-login-theme text-slate-800 antialiased min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 relative">

  <!-- Pattern Overlay -->
  <div class="fixed inset-0 bg-pattern pointer-events-none z-0"></div>

  <!-- Space Atas Kosong Untuk Keseimbangan Tampilan -->
  <div class="w-full max-w-md z-10 pt-2 sm:pt-6">
    <!-- Tombol Navigasi Kembali -->
    <a href="/" class="inline-flex items-center gap-2 text-xs font-extrabold text-emerald-950 hover:text-amber-800 bg-white/90 hover:bg-white px-4 py-2.5 rounded-2xl border border-amber-200/60 shadow-xs hover:shadow-md transition-all duration-200 active:scale-98">
      <i class="fa-solid fa-arrow-left text-amber-700"></i> Kembali ke Katalog Utama
    </a>
  </div>

  <!-- CONTAINER LOGIN UTAMA -->
  <div class="relative z-10 w-full max-w-md my-auto py-4">
    
    <!-- KARTU FORM LOGIN MEWAH -->
    <div class="bg-white/90 backdrop-blur-2xl p-7 sm:p-9 rounded-3xl shadow-2xl border border-amber-100/90 ring-1 ring-amber-400/20 relative overflow-hidden">
      
      <!-- Aksesoris Accent Bar Atas -->
      <div class="absolute top-0 inset-x-0 h-1.5 bg-gradient-to-r from-emerald-800 via-amber-500 to-teal-900"></div>

      <!-- Header Form & Logo -->
      <div class="text-center mb-7 pt-2">
        <div class="flex justify-center mb-4 relative">
          <div class="absolute inset-0 bg-amber-400/10 blur-xl rounded-full"></div>
          <img src="/logo.png" 
               alt="Logo Yayasan" 
               class="w-20 h-20 sm:w-24 sm:h-24 object-contain relative z-10 drop-shadow-sm" 
               onerror="this.style.display='none'">
        </div>
        
        <h1 class="font-serif-title text-2xl sm:text-3xl font-bold tracking-tight">
          <span class="text-gold-gradient italic">Login Dashboard</span>
        </h1>
        <p class="text-xs text-slate-500 mt-1 font-semibold tracking-wide">Yayasan Sentuhan Kasih</p>
      </div>

      <!-- Kotak Pesan Error (Muncul jika Login Gagal) -->
      <div id="error-box" class="hidden mb-5 p-3.5 bg-rose-50/90 border border-rose-200 rounded-2xl text-xs font-semibold text-rose-700 text-center flex items-center justify-center gap-2 shadow-xs transition-all">
        <i class="fa-solid fa-circle-exclamation text-rose-500 text-sm shrink-0"></i>
        <span id="error-text">Username atau password salah!</span>
      </div>

      <!-- FORM LOGIN -->
      <form id="form-login" class="space-y-4 text-xs">
        <div>
          <label for="username" class="font-bold text-emerald-950 block mb-1.5 tracking-wide">
            Username Admin
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
              <i class="fa-solid fa-user text-xs"></i>
            </span>
            <input type="text" 
                   id="username" 
                   name="username" 
                   required 
                   autocomplete="username"
                   placeholder="Masukkan username..." 
                   class="w-full pl-9 pr-3 py-3.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500 outline-none transition-all bg-slate-50/60 focus:bg-white text-slate-800 text-xs font-medium placeholder-slate-400">
          </div>
        </div>

        <div>
          <label for="password" class="font-bold text-emerald-950 block mb-1.5 tracking-wide">
            Password
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
              <i class="fa-solid fa-lock text-xs"></i>
            </span>
            <input type="password" 
                   id="password" 
                   name="password" 
                   required 
                   autocomplete="current-password"
                   placeholder="••••••••" 
                   class="w-full pl-9 pr-10 py-3.5 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500 outline-none transition-all bg-slate-50/60 focus:bg-white text-slate-800 text-xs font-medium placeholder-slate-400">
            
            <!-- Tombol Toggle Intip Password -->
            <button type="button" 
                    onclick="togglePasswordVisibility()" 
                    class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
              <i id="toggle-icon" class="fa-solid fa-eye text-xs"></i>
            </button>
          </div>
        </div>

        <button type="submit" 
                id="btn-login" 
                class="w-full py-3.5 bg-gradient-to-r from-emerald-800 via-emerald-900 to-teal-950 hover:from-emerald-900 hover:to-teal-950 text-white font-extrabold rounded-2xl transition-all shadow-md hover:shadow-xl active:scale-98 text-xs mt-4 flex items-center justify-center gap-2 cursor-pointer border border-emerald-700/50">
          <i class="fa-solid fa-right-to-bracket text-sm"></i> Masuk Dashboard
        </button>
      </form>

      <!-- Footer Kartu -->
      <div class="mt-6 pt-4 border-t border-slate-100 text-center text-[11px] text-slate-400 font-medium flex items-center justify-center gap-1">
        <i class="fa-solid fa-shield-halved text-amber-600/90"></i> 
        <span>Akses terbatas khusus untuk pengelola sistem.</span>
      </div>

    </div>

  </div>

  <!-- FOOTER BAWAH -->
  <footer class="z-10 pb-2 text-center text-[11px] text-slate-400 font-medium">
    © 2026 Yayasan Sentuhan Kasih. Hak Cipta Dilindungi.
  </footer>

  <!-- SCRIPT LOGIC -->
  <script>
    // Fitur Toggle Lihat/Sembunyikan Password
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggle-icon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    }

    // Handler Form Login API
    document.getElementById('form-login').onsubmit = async (e) => {
      e.preventDefault();

      const btnLogin = document.getElementById('btn-login');
      const errorBox = document.getElementById('error-box');
      const errorText = document.getElementById('error-text');

      // Reset state error
      errorBox.classList.add('hidden');
      errorText.innerText = '';

      // Set State Loading
      btnLogin.disabled = true;
      btnLogin.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-sm"></i> Memeriksa Sesi...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: e.target.username.value,
            password: e.target.password.value
          })
        });

        const result = await res.json();

        if (result.success) {
          window.location.href = '/admin';
        } else {
          errorText.innerText = result.message || 'Username atau password salah!';
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        errorText.innerText = 'Terjadi kesalahan koneksi ke server.';
        errorBox.classList.remove('hidden');
      } finally {
        btnLogin.disabled = false;
        btnLogin.innerHTML = '<i class="fa-solid fa-right-to-bracket text-sm"></i> Masuk Dashboard';
      }
    };
  </script>
</body>
</html>
