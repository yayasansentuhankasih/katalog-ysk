<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Yayasan Sentuhan Kasih</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Inter', sans-serif; 
    }
    .bg-admin-theme {
      background: linear-gradient(135deg, #e8f6f6 0%, #dcf0f2 50%, #eaf8f8 100%);
      background-attachment: fixed;
    }
    .bg-pattern {
      background-image: radial-gradient(#00a896 0.6px, transparent 0.6px);
      background-size: 20px 20px;
      opacity: 0.12;
    }
  </style>
</head>
<body class="bg-admin-theme text-slate-800 antialiased min-h-screen p-4 sm:p-6 lg:p-8 relative">

  <!-- Pattern Overlay -->
  <div class="fixed inset-0 bg-pattern pointer-events-none z-0"></div>

  <!-- MAIN CONTAINER -->
  <div class="max-w-7xl mx-auto space-y-6 relative z-10">
    
    <!-- HEADER -->
    <header class="flex flex-col md:flex-row justify-between items-center bg-white/90 backdrop-blur-md p-5 rounded-2xl shadow-sm border border-teal-100/80 gap-4">
      <!-- Logo & Title -->
      <div class="flex items-center gap-3.5">
        <img src="/logo.png" alt="Logo Yayasan" class="w-11 h-11 object-contain rounded-xl shadow-sm bg-white p-1 border border-teal-100" onerror="this.style.display='none'">
        <div>
          <h1 class="text-xl font-extrabold text-teal-950 tracking-tight">Dashboard Panel Admin</h1>
          <p class="text-xs font-medium text-slate-500">Kelola Data & Dokumen Kandidat - Yayasan Sentuhan Kasih</p>
        </div>
      </div>

      <!-- Action Buttons Header -->
      <div class="flex items-center gap-2.5 w-full md:w-auto justify-end">
        <a href="/" class="text-xs bg-white hover:bg-slate-50 text-slate-700 hover:text-teal-800 px-4 py-2.5 rounded-xl border border-slate-200 font-bold shadow-sm transition-all flex items-center gap-2">
          🌐 Lihat Katalog Utama
        </a>
        
        <button onclick="logoutAdmin()" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold px-4 py-2.5 rounded-xl border border-rose-200 shadow-sm transition-all flex items-center gap-1.5 cursor-pointer">
          🔓 Logout Admin
        </button>
      </div>
    </header>

    <!-- MAIN GRID LAYOUT -->
    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- FORM INPUT KANDIDAT -->
      <section class="bg-white/95 backdrop-blur-sm p-6 rounded-2xl shadow-sm border border-teal-100/80 lg:col-span-1 flex flex-col justify-between">
        <div>
          <h2 class="text-sm font-extrabold text-teal-900 mb-4 pb-3 border-b border-slate-100 flex items-center gap-2 uppercase tracking-wider">
            <span>➕</span> Tambah Kandidat Baru
          </h2>
          
          <form id="form-kandidat" onsubmit="simpanData(event)" class="space-y-3.5 text-xs">
            <!-- Nama Lengkap -->
            <div>
              <label class="font-bold text-slate-700 block mb-1">Nama Lengkap</label>
              <input type="text" id="input-nama" required placeholder="Masukkan nama lengkap..." class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all text-slate-800">
            </div>

            <!-- Kategori Pekerjaan -->
            <div>
              <label class="font-bold text-slate-700 block mb-1">Kategori Pekerjaan</label>
              <select id="input-kategori" class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none bg-white transition-all text-slate-800">
                <option value="Asisten Rumah Tangga (ART)">Asisten Rumah Tangga (ART)</option>
                <option value="Baby Sitter / Pengasuh">Baby Sitter / Pengasuh</option>
                <option value="Perawat Lansia / Caregiver">Perawat Lansia / Caregiver</option>
                <option value="Driver">Driver</option>
                <option value="Tukang Kebun">Tukang Kebun</option>
                <option value="Security">Security</option>
              </select>
            </div>

            <!-- Nomor HP / WA -->
            <div>
              <label class="font-bold text-slate-700 block mb-1">Nomor HP / WA Kandidat</label>
              <input type="text" id="input-nohp" required placeholder="Contoh: 081234567890" class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all text-slate-800">
            </div>

            <!-- Umur & Pengalaman -->
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="font-bold text-slate-700 block mb-1">Umur (Tahun)</label>
                <input type="number" id="input-umur" placeholder="25" required class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all text-slate-800">
              </div>
              <div>
                <label class="font-bold text-slate-700 block mb-1">Pengalaman (Thn)</label>
                <input type="number" id="input-pengalaman" placeholder="2" required class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all text-slate-800">
              </div>
            </div>

            <!-- Tinggi & Berat Badan -->
            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="font-bold text-slate-700 block mb-1">Tinggi (cm)</label>
                <input type="number" id="input-tinggi" placeholder="160" class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all text-slate-800">
              </div>
              <div>
                <label class="font-bold text-slate-700 block mb-1">Berat (kg)</label>
                <input type="number" id="input-berat" placeholder="55" class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all text-slate-800">
              </div>
            </div>

            <!-- Kota Asal -->
            <div>
              <label class="font-bold text-slate-700 block mb-1">Kota Asal</label>
              <input type="text" id="input-asal" placeholder="Contoh: Lampung" required class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all text-slate-800">
            </div>

            <!-- Keahlian Ringkas -->
            <div>
              <label class="font-bold text-slate-700 block mb-1">Keahlian Ringkas</label>
              <input type="text" id="input-keahlian" placeholder="Contoh: Masak, Bebersih, Rawat Lansia" required class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all text-slate-800">
            </div>

            <!-- Ekspektasi Gaji -->
            <div>
              <label class="font-bold text-slate-700 block mb-1">Ekspektasi Gaji (Rp)</label>
              <input type="number" id="input-gaji" placeholder="Contoh: 2500000" required class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all text-slate-800">
            </div>

            <!-- Status Availability -->
            <div>
              <label class="font-bold text-slate-700 block mb-1">Status Ketersediaan</label>
              <select id="input-status" class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none bg-white transition-all text-slate-800">
                <option value="READY WORK">READY WORK</option>
                <option value="TER-SALUR">TER-SALUR</option>
              </select>
            </div>

            <!-- Upload File Area -->
            <div class="p-3 bg-teal-50/50 rounded-xl border border-teal-100 space-y-2.5 mt-2">
              <div>
                <label class="font-bold text-slate-700 block mb-1">🖼️ Upload Foto Profil</label>
                <input type="file" id="input-foto" accept="image/*" required class="w-full p-1.5 border border-slate-200 rounded-lg bg-white text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-teal-100 file:text-teal-800 hover:file:bg-teal-200 cursor-pointer">
              </div>

              <div>
                <label class="font-bold text-slate-700 block mb-1">📄 Upload Dokumen CV</label>
                <input type="file" id="input-cv" accept="image/*" class="w-full p-1.5 border border-slate-200 rounded-lg bg-white text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-teal-100 file:text-teal-800 hover:file:bg-teal-200 cursor-pointer">
              </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="btn-submit" class="w-full py-3 bg-orange-500 hover:bg-orange-600 active:scale-[0.99] text-white font-extrabold rounded-xl transition-all shadow-md shadow-orange-500/20 text-xs mt-3 flex items-center justify-center gap-2 cursor-pointer">
              💾 Simpan Data & Upload File
            </button>
          </form>
        </div>
      </section>

      <!-- TABEL DAFTAR KANDIDAT -->
      <section class="bg-white/95 backdrop-blur-sm p-6 rounded-2xl shadow-sm border border-teal-100/80 lg:col-span-2 flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
            <h2 class="text-sm font-extrabold text-teal-900 flex items-center gap-2 uppercase tracking-wider">
              <span>📋</span> Daftar Kandidat Terdaftar
            </h2>
            <button onclick="loadDataAdmin()" class="text-xs bg-slate-50 hover:bg-slate-100 text-slate-600 px-3 py-1.5 rounded-xl border border-slate-200 font-bold transition-all flex items-center gap-1.5 cursor-pointer">
              🔄 Refresh Data
            </button>
          </div>
          
          <div class="overflow-x-auto rounded-xl border border-slate-100">
            <table class="w-full text-left text-xs border-collapse">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200/80 text-slate-500 font-bold uppercase tracking-wider">
                  <th class="p-3.5">ID</th>
                  <th class="p-3.5">Nama</th>
                  <th class="p-3.5">Kategori</th>
                  <th class="p-3.5">No. HP</th>
                  <th class="p-3.5">Status</th>
                  <th class="p-3.5 text-center">Aksi</th>
                </tr>
              </thead>
              <tbody id="tabel-body" class="divide-y divide-slate-100">
                <tr>
                  <td colspan="6" class="p-8 text-center text-slate-400 font-medium">Memuat data kandidat...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

    </main>

    <!-- FOOTER -->
    <footer class="bg-white/80 border-t border-slate-200 py-4 text-center text-xs text-slate-500 rounded-xl">
      <p>© 2026 Yayasan Sentuhan Kasih. Panel Manajemen Admin.</p>
    </footer>

  </div>

  <script>
    async function loadDataAdmin() {
      try {
        const res = await fetch('/api/candidates?t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          renderTabel(data);
        } else {
          alert("Gagal memuat data dari server.");
        }
      } catch (err) {
        alert("Gagal terhubung ke backend server Node.js!");
      }
    }

    function renderTabel(data) {
      const tbody = document.getElementById('tabel-body');
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400 font-medium">Belum ada data kandidat tersimpan.</td></tr>`;
        return;
      }

      let html = '';
      data.forEach(item => {
        const isReady = (item.status || '').toUpperCase().includes('READY');
        const statusText = isReady ? 'READY WORK' : 'TER-SALUR';
    
        html += `
          <tr class="hover:bg-teal-50/40 transition-colors">
            <td class="p-3.5 font-bold text-slate-700">#${item.id}</td>
            <td class="p-3.5 font-bold text-slate-900">${item.nama}</td>
            <td class="p-3.5 text-slate-600 font-medium">${item.kategori || '-'}</td>
            <td class="p-3.5 font-bold text-teal-800">📱 ${item.noHp || '-'}</td>
            <td class="p-3.5">
              <!-- Tombol Interaktif untuk Mengubah Status -->
              <button onclick="gantiStatus('${item.id}', '${statusText}')" 
                      title="Klik untuk mengubah status"
                      class="px-2.5 py-1 text-[10px] font-extrabold rounded-lg transition-all cursor-pointer flex items-center gap-1 shadow-sm active:scale-95 ${
                        isReady 
                          ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200 border border-emerald-300' 
                          : 'bg-amber-100 text-amber-800 hover:bg-amber-200 border border-amber-300'
                      }">
                <span>${isReady ? '🟢' : '🔴'}</span>
                <span>${statusText}</span>
                <span class="text-[8px] opacity-60">🔄</span>
              </button>
            </td>
            <td class="p-3.5 text-center">
              <button onclick="hapusKandidat('${item.id}')" class="px-2.5 py-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg font-bold border border-rose-200 transition-colors cursor-pointer text-[11px]">
                🗑️ Hapus
              </button>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    async function simpanData(e) {
      e.preventDefault();
  
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = '⌛ Mengunggah File...';

      const formData = new FormData();
      formData.append('nama', document.getElementById('input-nama').value);
      formData.append('kategori', document.getElementById('input-kategori').value);
      formData.append('umur', document.getElementById('input-umur').value);
      formData.append('asal', document.getElementById('input-asal').value);
      formData.append('pengalaman', document.getElementById('input-pengalaman').value);
      formData.append('keahlian', document.getElementById('input-keahlian').value);
      formData.append('gaji', document.getElementById('input-gaji').value);
      formData.append('status', document.getElementById('input-status').value);
      formData.append('noHp', document.getElementById('input-nohp').value);
      formData.append('tinggi', document.getElementById('input-tinggi').value);
      formData.append('berat', document.getElementById('input-berat').value);

      const fileFoto = document.getElementById('input-foto').files[0];
      const fileCv = document.getElementById('input-cv').files[0];

      if (fileFoto) formData.append('foto', fileFoto);
      if (fileCv) formData.append('fotoCv', fileCv);

      try {
        const res = await fetch('/api/candidates', {
          method: 'POST',
          body: formData
        });

        const result = await res.json();

        if (res.ok && result.success) {
          alert('✅ Data kandidat dan file berhasil diupload!');
          document.getElementById('form-kandidat').reset();
          loadDataAdmin();
        } else {
          alert('❌ Gagal: ' + (result.message || 'Terjadi kesalahan'));
        }
      } catch (err) {
        alert('Terjadi kesalahan koneksi server.');
      } finally {
        btn.disabled = false;
        btn.innerText = '💾 Simpan Data & Upload File';
      }
    }

    async function hapusKandidat(id) {
      if (!confirm(`Apakah Anda yakin ingin menghapus kandidat ID ${id}?`)) return;

      try {
        const res = await fetch(`/api/candidates/${id}`, { method: 'DELETE' });
        if (res.ok) {
          loadDataAdmin();
        } else {
          alert("Gagal menghapus data.");
        }
      } catch (err) {
        alert("Error server.");
      }
    }

    async function gantiStatus(id, statusSekarang) {
      const statusBaru = statusSekarang === 'READY WORK' ? 'TER-SALUR' : 'READY WORK';

      if (!confirm(`Ubah status kandidat ${id} menjadi "${statusBaru}"?`)) return;

      try {
        const res = await fetch(`/api/candidates/${id}/status`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ status: statusBaru })
        });

        const result = await res.json();

        if (res.ok && result.success) {
          loadDataAdmin();
        } else {
          alert("❌ Gagal memperbarui status: " + (result.message || 'Error'));
        }
      } catch (err) {
        alert("Terjadi kesalahan koneksi server.");
      }
    }

    async function logoutAdmin() {
      try {
        const res = await fetch('/api/logout', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          alert('Berhasil Logout!');
          window.location.href = '/';
        }
      } catch (err) {
        alert('Gagal logout dari server.');
      }
    }

    document.addEventListener('DOMContentLoaded', loadDataAdmin);
  </script>
</body>
</html>
