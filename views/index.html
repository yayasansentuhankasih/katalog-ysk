<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Digital Kandidat - Yayasan Sentuhan Kasih</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { 
      font-family: 'Inter', sans-serif; 
    } 
    .bg-katalog-theme {
      background: linear-gradient(135deg, #e8f6f6 0%, #dcf0f2 50%, #eaf8f8 100%);
      background-attachment: fixed;
    }
    .bg-pattern {
      background-image: radial-gradient(#00a896 0.6px, transparent 0.6px);
      background-size: 20px 20px;
      opacity: 0.12;
    }
  </style>
</head>
<body class="bg-katalog-theme text-slate-800 antialiased min-h-screen flex flex-col justify-between relative">

  <!-- Pattern Overlay -->
  <div class="absolute inset-0 bg-pattern pointer-events-none z-0"></div>

  <!-- CONTAINER UTAMA -->
  <div class="relative z-10 flex-grow flex flex-col justify-between">

    <!-- HEADER -->
    <header class="pt-6 pb-4 px-4 sm:px-8 max-w-7xl mx-auto w-full flex flex-col md:flex-row items-center justify-between gap-4">
      <!-- Logo & Nama Yayasan -->
      <div class="flex items-center gap-3">
        <img src="/logo.png" alt="Logo Yayasan" class="w-11 h-11 object-contain rounded-lg shadow-sm bg-white p-1" onerror="this.style.display='none'">
        <div>
          <h2 class="text-sm font-extrabold text-slate-800 leading-tight">Yayasan</h2>
          <h2 class="text-xs font-bold text-teal-700 leading-tight">Sentuhan Kasih</h2>
        </div>
      </div>

      <!-- Judul Utama -->
      <div class="text-center">
        <h1 class="text-2xl md:text-3xl font-extrabold text-teal-900 tracking-wide uppercase">
          KATALOG KANDIDAT READY
        </h1>
        <p class="text-xs text-slate-500 mt-0.5">Penyaluran Tenaga Kerja Terpercaya & Profesional</p>
      </div>

      <!-- Tombol Navigasi Admin & Auth -->
      <div class="flex items-center gap-2">
        <a id="btn-dashboard" 
           href="/admin" 
           class="hidden text-xs px-3.5 py-2 bg-teal-800 hover:bg-teal-900 text-white font-bold rounded-xl shadow-sm transition-all flex items-center gap-1.5 cursor-pointer">
          🛠️ Dashboard Admin
        </a>

        <button 
          id="btn-auth" 
          onclick="handleAuthClick()" 
          class="text-xs px-3.5 py-2 bg-white/90 hover:bg-white text-slate-700 font-medium rounded-xl border border-teal-100 shadow-sm transition-all flex items-center gap-1.5 cursor-pointer">
          🔒 Login Admin
        </button>
      </div>
    </header>

    <!-- CONTENT BODY -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2 w-full flex-grow">
      
      <!-- FILTER BAR -->
      <div class="bg-white/90 backdrop-blur-md p-3.5 rounded-2xl border border-teal-100 shadow-sm mb-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
          
          <div>
            <input type="text" id="filter-search" oninput="filterData()" 
                   placeholder="Cari Nama/ID/Keahlian..." 
                   class="w-full text-xs p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none bg-white text-slate-700">
          </div>

          <div>
            <select id="filter-kategori" onchange="filterData()" class="w-full text-xs p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none bg-white text-slate-700">
              <option value="Semua">Semua Kategori</option>
              <option value="Asisten Rumah Tangga (ART)">Asisten Rumah Tangga (ART)</option>
              <option value="Baby Sitter / Pengasuh">Baby Sitter / Pengasuh</option>
              <option value="Perawat Lansia / Caregiver">Perawat Lansia / Caregiver</option>
              <option value="Driver">Driver</option>
              <option value="Tukang Kebun">Tukang Kebun</option>
              <option value="Security">Security</option>
            </select>
          </div>

          <div>
            <select id="filter-pengalaman" onchange="filterData()" class="w-full text-xs p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none bg-white text-slate-700">
              <option value="Semua">Pengalaman: Semua</option>
              <option value="kurang1">Pengalaman: &lt; 1 Tahun</option>
              <option value="1sampai3">Pengalaman: 1 - 3 Tahun</option>
              <option value="lebih3">Pengalaman: &gt; 3 Tahun</option>
            </select>
          </div>

        </div>
      </div>

      <!-- GRID LIST KANDIDAT -->
      <div id="kandidat-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
        <div class="col-span-full text-center py-12 text-slate-400 font-medium text-sm">
          Memuat data kandidat...
        </div>
      </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-white/80 border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-8">
      <p>© 2026 Yayasan Sentuhan Kasih. Seluruh Hak Cipta Dilindungi.</p>
    </footer>

  </div>

  <!-- 📌 MODAL VIEW CV -->
  <div id="modal-cv" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-5 max-h-[90vh] flex flex-col border border-teal-100">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-3">
        <h3 class="text-sm font-extrabold text-teal-950">📄 Dokumen CV Kandidat (<span id="modal-cv-nama"></span>)</h3>
        <button onclick="tutupModalCv()" class="text-slate-400 hover:text-slate-600 text-lg font-bold cursor-pointer">✕</button>
      </div>
      <div class="flex-grow overflow-y-auto flex items-center justify-center bg-slate-50 rounded-xl p-2 border border-slate-200">
        <img id="modal-cv-img" src="" alt="Dokumen CV" class="max-w-full max-h-[70vh] object-contain rounded-lg">
      </div>
      <div class="pt-3 border-t border-slate-100 mt-3 flex justify-end">
        <button onclick="tutupModalCv()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl cursor-pointer">Tutup</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // 📌 ATUR NOMOR HP ADMIN YAYASAN DI SINI (Ganti dengan nomor WhatsApp Admin Anda)
    const NO_HP_ADMIN = "081234567890"; 

    let allCandidates = [];
    let isAdminLoggedIn = false;

    async function checkAuthStatus() {
      try {
        const res = await fetch('/api/check-auth');
        const data = await res.json();
        isAdminLoggedIn = data.isAdmin;

        const btnDashboard = document.getElementById('btn-dashboard');
        const btnAuth = document.getElementById('btn-auth');

        if (isAdminLoggedIn) {
          btnDashboard.classList.remove('hidden');
          btnAuth.innerHTML = '🔓 Logout Admin';
        } else {
          btnDashboard.classList.add('hidden');
          btnAuth.innerHTML = '🔒 Login Admin';
        }
      } catch (e) {
        console.error("Gagal memeriksa status auth.");
      }
    }

    async function handleAuthClick() {
      if (isAdminLoggedIn) {
        if (confirm("Apakah Anda yakin ingin logout?")) {
          await fetch('/api/logout', { method: 'POST' });
          location.reload();
        }
      } else {
        window.location.href = '/login';
      }
    }

    async function fetchCandidates() {
      try {
        const res = await fetch('/api/candidates?t=' + Date.now());
        if (res.ok) {
          allCandidates = await res.json();
          filterData();
        }
      } catch (e) {
        document.getElementById('kandidat-container').innerHTML = `
          <div class="col-span-full text-center py-12 text-rose-500 font-medium text-sm">
            Gagal terhubung ke server.
          </div>`;
      }
    }

    function filterData() {
      const search = document.getElementById('filter-search').value.toLowerCase();
      const kategori = document.getElementById('filter-kategori').value;
      const pengalaman = document.getElementById('filter-pengalaman').value;

      const filtered = allCandidates.filter(item => {
        // Multi-kategori match
        let matchesKategori = false;
        if (kategori === 'Semua') {
          matchesKategori = true;
        } else if (Array.isArray(item.kategori)) {
          matchesKategori = item.kategori.includes(kategori);
        } else if (item.kategori) {
          matchesKategori = item.kategori === kategori;
        }

        // Pengalaman match
        const exp = parseInt(item.pengalaman) || 0;
        let matchesPengalaman = true;
        if (pengalaman === 'kurang1') matchesPengalaman = exp < 1;
        else if (pengalaman === '1sampai3') matchesPengalaman = exp >= 1 && exp <= 3;
        else if (pengalaman === 'lebih3') matchesPengalaman = exp > 3;

        // Search text match
        const textSearch = `${item.nama} ${item.id} ${item.keahlian} ${item.asal}`.toLowerCase();
        const matchesSearch = textSearch.includes(search);

        return matchesKategori && matchesPengalaman && matchesSearch;
      });

      renderCandidates(filtered);
    }

    function renderCandidates(candidates) {
      const container = document.getElementById('kandidat-container');
      if (!candidates || candidates.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-12 text-slate-400 font-medium text-sm">
            Tidak ada kandidat yang cocok dengan kriteria pencarian.
          </div>`;
        return;
      }

      const formattedAdminHp = NO_HP_ADMIN.replace(/[^0-9]/g, '');

      container.innerHTML = candidates.map(item => {
        const isReady = (item.status || '').toUpperCase().includes('READY');

        // Kategori badging
        let categoriesHtml = '';
        if (Array.isArray(item.kategori)) {
          categoriesHtml = item.kategori.map(k => `<span class="bg-teal-50 text-teal-800 border border-teal-200 px-2 py-0.5 rounded-md text-[10px] font-bold">${k}</span>`).join(' ');
        } else {
          categoriesHtml = `<span class="bg-teal-50 text-teal-800 border border-teal-200 px-2 py-0.5 rounded-md text-[10px] font-bold">${item.kategori || '-'}</span>`;
        }

        // Gaji Rendering
        let gajiHtml = '';
        if (typeof item.gaji === 'object' && item.gaji !== null && !Array.isArray(item.gaji)) {
          gajiHtml = Object.entries(item.gaji).map(([k, v]) => `
            <div class="flex justify-between items-center text-xs">
              <span class="text-slate-500 font-medium">${k}:</span>
              <span class="font-extrabold text-teal-700">Rp ${Number(v).toLocaleString('id-ID')}</span>
            </div>
          `).join('');
        } else {
          gajiHtml = `
            <div class="flex justify-between items-center text-xs">
              <span class="text-slate-500 font-medium">Gaji:</span>
              <span class="font-extrabold text-teal-700">Rp ${Number(item.gaji || 0).toLocaleString('id-ID')}</span>
            </div>`;
        }

        const cvUrl = item.fotoCv || item.foto || '';

        // Pesan otomatis untuk Admin
        const waMessage = encodeURIComponent(`Halo Admin Yayasan Sentuhan Kasih, saya tertarik untuk menyalurkan kandidat:\n\n*Nama:* ${item.nama}\n*ID Kandidat:* #${item.id}\n\nMohon informasi lebih lanjut.`);

        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-teal-100/80 flex flex-col justify-between hover:shadow-md transition-all">
            <div>
              <div class="relative mb-3">
                <img src="${item.foto || '/placeholder.png'}" alt="${item.nama}" class="w-full h-48 object-cover rounded-xl border border-slate-100" onerror="this.src='https://via.placeholder.com/300x300?text=Foto+Kandidat'">
                <span class="absolute top-2 right-2 px-2.5 py-1 text-[10px] font-extrabold rounded-lg shadow-sm ${isReady ? 'bg-emerald-500 text-white' : 'bg-amber-500 text-white'}">
                  ${isReady ? 'READY WORK' : 'TER-SALUR'}
                </span>
                <span class="absolute bottom-2 left-2 bg-slate-900/70 text-white px-2 py-0.5 rounded-md text-[10px] font-bold backdrop-blur-xs">
                  #${item.id}
                </span>
              </div>

              <h3 class="font-extrabold text-slate-800 text-base leading-snug mb-1">${item.nama}</h3>
              <div class="flex flex-wrap gap-1 mb-3">
                ${categoriesHtml}
              </div>

              <div class="space-y-1 text-xs text-slate-600 mb-3 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                <p><b>Umur:</b> ${item.umur || '-'} Tahun</p>
                <p><b>Pengalaman:</b> ${item.pengalaman || '-'} Tahun</p>
                <p><b>TB / BB:</b> ${item.tinggi || '-'} cm / ${item.berat || '-'} kg</p>
                <p><b>Asal:</b> ${item.asal || '-'}</p>
                <p><b>Keahlian:</b> ${item.keahlian || '-'}</p>
              </div>

              <div class="border-t border-slate-100 pt-2 space-y-1 mb-4">
                ${gajiHtml}
              </div>
            </div>

            <div class="space-y-2">
              ${cvUrl ? `
                <button onclick="bukaModalCv('${item.nama}', '${cvUrl}')" class="w-full py-2 bg-teal-50 hover:bg-teal-100 border border-teal-200 text-teal-800 font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all cursor-pointer">
                  📄 Lihat Dokumen CV
                </button>
              ` : ''}

              <!-- Tombol WhatsApp Mengarah ke Admin Yayasan -->
              <a href="https://wa.me/${formattedAdminHp}?text=${waMessage}" target="_blank" class="w-full py-2.5 bg-teal-700 hover:bg-teal-800 active:scale-[0.98] text-white font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all shadow-sm">
                💬 Hubungi Admin via WhatsApp
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function bukaModalCv(nama, url) {
      document.getElementById('modal-cv-nama').innerText = nama;
      document.getElementById('modal-cv-img').src = url;
      document.getElementById('modal-cv').classList.remove('hidden');
    }

    function tutupModalCv() {
      document.getElementById('modal-cv').classList.add('hidden');
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkAuthStatus();
      fetchCandidates();
    });
  </script>
</body>
</html>
